name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# P1 moves tui/ to cmd/archmaid/ and go.mod to the repo root: update the paths
# here (and in the Makefile variables) in this one spot.
env:
  GO_MOD_FILE: tui/go.mod
  GO_SUM_FILE: tui/go.sum
  E2E_DIR: tui/e2e

jobs:
  core:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed go gcc git make  # gcc: -race needs cgo
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Go version
        id: gover
        run: echo "v=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ steps.gover.outputs.v }}-${{ hashFiles(env.GO_SUM_FILE) }}
          restore-keys: |
            go-${{ steps.gover.outputs.v }}-
      - run: make all

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_MOD_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}
      - uses: charmbracelet/vhs-action@v2
      - run: make e2e
      - name: Upload e2e output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: ${{ env.E2E_DIR }}/*.txt
          if-no-files-found: ignore

  # Planned: gui, a headless-weston job for the GUI module (it does not exist
  # yet). Run only when the GUI paths change: install weston and the GUI build
  # deps in an archlinux container, start `weston --backend=headless`, point
  # WAYLAND_DISPLAY at it, then run the GUI tests and screenshot goldens.
