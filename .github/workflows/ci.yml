name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Module and e2e paths: update them
# here (and in the Makefile variables) in this one spot.
env:
  GO_MOD_FILE: go.mod
  GO_SUM_FILE: go.sum
  E2E_DIR: cmd/archmaid/e2e
  GUI_SUM_FILE: gui/go.sum

jobs:
  # Picks the container image for core and gui. Preferred: our copy of the Arch
  # base on ghcr.io (built by ci-image.yml), pulled with the job token, so no
  # anonymous pull from a capped registry. If it doesn't exist (first run, a
  # deleted package) or ghcr can't be reached or isn't readable (fork PR token),
  # fall back to the ECR image, which is the old behaviour. The jobs still run
  # `pacman -Syu`, so a stale image costs time, not correctness.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.pick.outputs.image }}
      ghcr: ${{ steps.pick.outputs.ghcr }}
    steps:
      - name: Pick the image
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fallback=public.ecr.aws/docker/library/archlinux:latest
          ours="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/archmaid-ci-arch:latest"
          if echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
              && docker manifest inspect "$ours" > /dev/null; then
            echo "image=$ours" >> "$GITHUB_OUTPUT"
            echo "ghcr=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$ours is not available; falling back to $fallback"
            echo "image=$fallback" >> "$GITHUB_OUTPUT"
            echo "ghcr=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    runs-on: ubuntu-latest
    needs: image
    # Image and registry login come from the `image` job: our ghcr copy, or the
    # ECR one with empty credentials (no login).
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ needs.image.outputs.ghcr == 'true' && github.actor || '' }}
        password: ${{ needs.image.outputs.ghcr == 'true' && secrets.GITHUB_TOKEN || '' }}
    steps:
      - name: Install toolchain
        # gcc: -race needs cgo. diffutils: scripts/state-guard.sh compares
        # with diff, which the archlinux image's base doesn't include.
        run: pacman -Syu --noconfirm --needed go gcc git make diffutils
      - uses: actions/checkout@v7
      # The app never runs as root, so neither do its tests: a root-only pass
      # (permissions, uid checks) must not be able to hide a user-only failure.
      - name: Create an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Go version
        id: gover
        run: echo "v=$(runuser -u builder -- go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            /home/builder/.cache/go-build
            /home/builder/go/pkg/mod
          key: go-${{ steps.gover.outputs.v }}-${{ hashFiles(env.GO_SUM_FILE) }}
          restore-keys: |
            go-${{ steps.gover.outputs.v }}-
      - name: Make the restored caches the user's
        run: |
          mkdir -p /home/builder/.cache/go-build /home/builder/go/pkg/mod
          chown -R builder:builder /home/builder
      # A populated state dir for the gate's state guard (and every package's
      # testenv.Run) to protect, as on a real machine; CI only.
      - name: Seed a fake state dir (as builder)
        run: runuser -u builder -- env HOME=/home/builder "$GITHUB_WORKSPACE/scripts/ci-seed-state.sh"
      - name: make all (as builder)
        run: runuser -u builder -- env HOME=/home/builder make -C "$GITHUB_WORKSPACE" all
      - name: The seeded state dir is intact
        run: runuser -u builder -- env HOME=/home/builder "$GITHUB_WORKSPACE/scripts/ci-seed-state.sh" --verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_MOD_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}
      - uses: charmbracelet/vhs-action@v2
      # The runner's real $HOME/.local/state/archmaid gets a fake history, so
      # run.sh's state guard checks real content; CI only.
      - name: Seed a fake state dir
        run: scripts/ci-seed-state.sh
      - run: make e2e
      - name: The seeded state dir is intact
        run: scripts/ci-seed-state.sh --verify
      - name: Upload e2e output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: ${{ env.E2E_DIR }}/*.txt
          if-no-files-found: ignore

  # Benchmarks the base commit and HEAD back to back on this one runner (see
  # scripts/bench-compare.sh) and fails on a significant slowdown, so runner
  # speed cancels out. Not part of `core`: timing must not run beside -race.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base commit and the merge-base need history
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_MOD_FILE }}
          cache-dependency-path: ${{ env.GO_SUM_FILE }}
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod/golang.org/x/perf*
          key: benchstat-${{ hashFiles('scripts/bench-compare.sh') }}
      - name: Pick the base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            base="${{ github.event.before }}"
            # a new branch or a force push has no usable previous SHA
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Compare benchmarks
        if: steps.base.outputs.sha != ''
        env:
          BENCH_OUT: ${{ runner.temp }}/bench
        run: scripts/bench-compare.sh "${{ steps.base.outputs.sha }}"
      - name: Upload benchstat output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchstat
          path: ${{ runner.temp }}/bench/
          if-no-files-found: ignore

  # The GUI module (gui/, its own go.mod: the jobs above never build gotk4).
  # Builds and vets it, runs the plain-Go tests, then the display tests in a
  # private headless weston (gui/scripts/headless.sh) with the cairo renderer
  # (no GPU here). The budgets aren't enforced: they are the dev machine's.
  # A cold gotk4 build is the slow part (cgo over all of GTK), so the build
  # cache is keyed on gui/go.sum and kept.
  gui:
    runs-on: ubuntu-latest
    needs: image
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ needs.image.outputs.ghcr == 'true' && github.actor || '' }}
        password: ${{ needs.image.outputs.ghcr == 'true' && secrets.GITHUB_TOKEN || '' }}
    timeout-minutes: 40
    steps:
      - name: Install toolchain, GTK and weston
        run: pacman -Syu --noconfirm --needed go gcc git make diffutils pkgconf gobject-introspection gtk4 libadwaita adwaita-icon-theme ttf-dejavu weston dbus
      - uses: actions/checkout@v7
      - name: Create an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Go version
        id: gover
        run: echo "v=$(runuser -u builder -- go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            /home/builder/.cache/go-build
            /home/builder/go/pkg/mod
          key: gui-${{ steps.gover.outputs.v }}-${{ hashFiles(env.GUI_SUM_FILE, env.GO_SUM_FILE) }}
          restore-keys: |
            gui-${{ steps.gover.outputs.v }}-
      - name: Make the restored caches the user's
        run: |
          mkdir -p /home/builder/.cache/go-build /home/builder/go/pkg/mod
          chown -R builder:builder /home/builder
      - name: make gui-test (as builder)
        run: runuser -u builder -- env HOME=/home/builder GSK_RENDERER=cairo HEADLESS_TIMEOUT=600 make -C "$GITHUB_WORKSPACE" gui-test
