# MANUAL ONLY (task #209, owner decision 2026-10-19): GitHub Actions minutes are
# used up, so nothing here runs on push, pull request or a schedule. CI of record
# is the test VM: `~/archmaid-vmtest/run.sh ci <sha>` runs core, e2e, gui and
# bench on a clean Arch install (harness README, "CI i VM'en"). Start this
# workflow by hand (workflow_dispatch) only if the owner wants it.
name: ci-image

# Builds the CI base image on GitHub's own registry, so the core and gui jobs
# don't depend on an anonymous pull from a rate-limited registry (see ci.yml).
on:
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/archmaid-ci-arch"
          docker build --pull -t "$image:latest" -t "$image:$(date -u +%Y%m%d)" .github/ci-image
          docker push --all-tags "$image"
